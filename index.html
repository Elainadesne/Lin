<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="林雨涵心理诊所 - 一个 AIRP 前端" />
    <title>林雨涵心理诊所</title>
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <style>
      #initial-loader {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition:
          opacity 1s ease-in-out,
          visibility 1s;
        background-color: var(--bg-color, #d1cbc3);
        width: 100vw;
        height: 100vh;
      }
      body.dark-mode #initial-loader {
        background-color: #1c1a18;
      }
      .loader-text {
        opacity: 0.6;
        animation: eqPulse 1s infinite alternate;
        color: #555;
        font-weight: 800;
        font-family: sans-serif;
        letter-spacing: 4px;
      }
      body.dark-mode .loader-text {
        color: #e8e3db;
      }
      @keyframes eqPulse {
        0% {
          transform: scale(0.98);
          opacity: 0.3;
        }
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
